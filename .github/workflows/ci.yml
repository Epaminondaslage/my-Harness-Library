name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n src/setup.sh
          bash -n src/regenerate.sh
          bash -n src/uninstall.sh

      - name: Backend answers over its socket
        run: |
          export SB=$(mktemp -d)
          mkdir -p "$SB/.claude/skills/demo" "$SB/run"
          printf -- '---\nname: demo\ndescription: Use when demonstrating\n---\n# demo\n' \
            > "$SB/.claude/skills/demo/SKILL.md"
          HOME="$SB" HARNESS_SOCKET="$SB/run/sock" python3 src/api.py & sleep 2
          curl -sf --unix-socket "$SB/run/sock" -X POST http://localhost/ \
            -H 'Content-Type: application/json' \
            -d '{"action":"read","file":"skills/demo/SKILL.md"}' | grep -q 'name: demo'
          curl -s --unix-socket "$SB/run/sock" -X POST http://localhost/ \
            -H 'Content-Type: application/json' \
            -d '{"action":"read","file":"plugins/x/SKILL.md"}' | grep -q 'escopo'
          kill %1

      - name: Python syntax
        run: python3 -m py_compile src/inventory.py src/api.py

      - name: systemd unit template is well formed
        run: |
          sed -e 's|@USER@|ci|g' -e 's|@HOME@|/home/ci|g' -e 's|@PREFIX@|/opt/hl|g' \
            src/harness-library.service.in > /tmp/hl.service
          systemd-analyze verify /tmp/hl.service || true
          grep -q 'ProtectSystem=strict' /tmp/hl.service
          grep -q 'NoNewPrivileges=yes' /tmp/hl.service

      - name: Generator runs and emits valid JS
        run: |
          mkdir -p /tmp/fake/.claude/skills/demo
          printf -- '---\nname: demo\ndescription: Use when demonstrating\n---\n\n# demo\n' \
            > /tmp/fake/.claude/skills/demo/SKILL.md
          python3 src/inventory.py /tmp/fake/.claude
          test -s claude_inventory_site/index.html
          node --check claude_inventory_site/app.js

      - name: No secrets committed
        run: |
          ! grep -rIE '\$2[aby]\$[0-9]{2}\$|ghp_[A-Za-z0-9]{20}|gho_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}' \
            --exclude-dir=.git . || { echo "possible secret committed"; exit 1; }
